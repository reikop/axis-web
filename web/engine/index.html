<!doctype html>
<meta charset="utf-8">
<title>AXIS engine (WASM/WebGL)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0b0d; color: #cdd3da; font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid #222; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  #sub { color: #8a929c; font-size: 12px; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  canvas { background: #111417; border: 1px solid #262b31; max-width: 100%; touch-action: none; }
  #status { font-size: 12px; color: #9aa3ad; min-height: 1.4em; }
  a { color: #6fb3ff; }
</style>
<header>
  <h1>AXIS engine — compiled C → WASM, rendering via WebGL</h1>
  <div id="sub">A real Emscripten program (not the decoder reactor): <code>main()</code> opens a GLES2
  context and renders an AXIS mesh decoded by the linked-in <code>axis_shp.c</code>. Your
  <code>Data/Shape.dat</code> is fetched locally — nothing is uploaded.</div>
</header>
<div id="wrap">
  <canvas id="canvas" width="720" height="480"></canvas>
  <div id="status">loading WASM…</div>
</div>
<script src="axis_engine.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const qs = new URLSearchParams(location.search);
  const mapName = qs.get('map');                         // ?map=CUBE  -> render a whole map
  const idx = qs.has('i') ? (+qs.get('i')) : 0;          // ?i=123     -> render one mesh

  async function fetchU8(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
    return new Uint8Array(await r.arrayBuffer());
  }
  function toWasm(M, u8) { const p = M.ccall('engine_alloc', 'number', ['number'], [u8.length]); M.HEAPU8.set(u8, p); return p; }

  AxisEngine({ canvas, onRuntimeInitialized() {} }).then(async (M) => {
    try {
      if (mapName) {
        statusEl.textContent = `fetching Shape.dat + Map/${mapName}.bfd …`;
        const [shape, bfd] = await Promise.all([fetchU8('/game/Data/Shape.dat'), fetchU8('/game/Map/' + mapName + '.bfd')]);
        const sp = toWasm(M, shape), bp = toWasm(M, bfd);
        const placed = M.ccall('engine_load_map', 'number', ['number', 'number', 'number', 'number'], [sp, shape.length, bp, bfd.length]);
        M.ccall('engine_free', null, ['number'], [sp]); M.ccall('engine_free', null, ['number'], [bp]);
        statusEl.textContent = placed >= 0
          ? `rendering map ${mapName} — ${placed} objects placed, meshes decoded by axis_shp.c in WASM, WebGL. (?map=NAME, or ?i=N for one mesh)`
          : `engine_load_map failed (code ${placed}) for ${mapName}`;
      } else {
        statusEl.textContent = 'fetching Data/Shape.dat …';
        const shape = await fetchU8('/game/Data/Shape.dat');
        const sp = toWasm(M, shape);
        const groups = M.ccall('engine_load_mesh', 'number', ['number', 'number', 'number'], [sp, shape.length, idx]);
        M.ccall('engine_free', null, ['number'], [sp]);
        statusEl.textContent = groups >= 0
          ? `rendering Shape.dat record #${idx} — ${groups} group(s). WASM backend, WebGL. (?i=N for meshes, ?map=NAME for maps)`
          : `engine_load_mesh failed (code ${groups}) for record #${idx}`;
      }
    } catch (e) {
      statusEl.textContent = 'load failed (run via run.py so /game/ is served): ' + e.message;
    }
  }).catch(e => { statusEl.textContent = 'WASM init failed: ' + e.message; });
</script>
