<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS Audio</title>
<style>
  :root{ --bg:#0e1420; --panel:#151d2c; --panel2:#1b2638; --line:#263349;
    --fg:#e6edf6; --muted:#8aa0bd; --accent:#38d0c8; --accent2:#f5a65b;
    --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; color-scheme:dark; }
  @media (prefers-color-scheme:light){ :root{ --bg:#eef2f7; --panel:#fff; --panel2:#f4f7fb;
    --line:#d6deea; --fg:#172031; --muted:#5b6b85; --accent:#0e8f88; --accent2:#c9731f; color-scheme:light; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);
    padding:24px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
  .head{max-width:980px;margin:0 auto 22px}
  h1{font:600 22px/1.2 var(--sans);margin:0} h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin-top:4px}
  a{color:var(--accent)}
  .wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:26px}
  @media (max-width:720px){ .wrap{grid-template-columns:1fr} }
  h2{font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .list{display:flex;flex-direction:column;gap:7px}
  .track{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;cursor:pointer}
  .track:hover{border-color:var(--accent)}
  .track.on{border-color:var(--accent);background:var(--panel2)}
  .ic{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:var(--panel2);color:var(--accent);font-size:12px}
  .track.music .ic{color:var(--accent2)}
  .nm{flex:1;min-width:0;font:13px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat{font:11px/1 var(--mono);color:var(--muted);text-transform:uppercase}
  .cat-h{font:600 11px/1 var(--mono);color:var(--accent);margin:10px 0 2px;letter-spacing:.08em}
  .player{position:sticky;bottom:0;max-width:980px;margin:22px auto 0;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .player .now{flex:1;min-width:0;font:13px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  audio{height:34px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="head">
  <h1>AXIS <span>Audio</span></h1>
  <div class="sub" id="sub">the game's music &amp; sound effects, played from your install</div>
  <div class="hint"><a href="home.html">← home</a> · <a href="textures.html">textures →</a></div>
</div>
<div class="wrap">
  <section><h2 id="mh">Music</h2><div class="list" id="music"></div></section>
  <section><h2 id="sh">Sound Effects</h2><div class="list" id="sfx"></div></section>
</div>
<div class="player">
  <div class="now" id="now">— select a track —</div>
  <audio id="au" controls></audio>
</div>
<script>
const au=document.getElementById("au"), now=document.getElementById("now");
let current=null;
function prettyMusic(p){ return p.split("/").pop().replace(/\.(mp3|ogg|wav)$/i,""); }
function prettySfx(p){ const parts=p.split("/"); return parts[parts.length-1]; }
function sfxCat(p){ const parts=p.split("/"); return parts.length>=3?parts[1]:"misc"; }

function play(el, path){
  if(current) current.classList.remove("on");
  el.classList.add("on"); current=el;
  now.textContent=path;
  au.src="/game/"+path; au.play().catch(()=>{});
}

function row(path, kind){
  const el=document.createElement("div");
  el.className="track "+kind;
  const label = kind==="music"?prettyMusic(path):prettySfx(path);
  el.innerHTML=`<span class="ic">${kind==="music"?"♪":"▸"}</span><span class="nm">${label}</span>`;
  el.addEventListener("click",()=>play(el,path));
  return el;
}

fetch("audio.json").then(r=>r.json()).then(a=>{
  const M=document.getElementById("music"), S=document.getElementById("sfx");
  (a.music||[]).forEach(p=>M.appendChild(row(p,"music")));
  document.getElementById("mh").textContent=`Music · ${(a.music||[]).length}`;
  // group sfx by category
  const groups={};
  (a.sfx||[]).forEach(p=>{ (groups[sfxCat(p)]||(groups[sfxCat(p)]=[])).push(p); });
  for(const c of Object.keys(groups).sort()){
    const h=document.createElement("div"); h.className="cat-h"; h.textContent=c+" · "+groups[c].length; S.appendChild(h);
    groups[c].forEach(p=>S.appendChild(row(p,"sfx")));
  }
  document.getElementById("sh").textContent=`Sound Effects · ${(a.sfx||[]).length}`;
}).catch(()=>{
  document.getElementById("sub").textContent="Run `python run.py` first (serves your install at /game/).";
});
</script>
</body>
</html>
