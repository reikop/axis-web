<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS Texture Gallery</title>
<style>
  :root{ --bg:#0e1420; --panel:#151d2c; --panel2:#1b2638; --line:#263349;
    --fg:#e6edf6; --muted:#8aa0bd; --accent:#38d0c8;
    --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; color-scheme:dark; }
  @media (prefers-color-scheme:light){ :root{ --bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;
    --line:#d6deea;--fg:#172031;--muted:#5b6b85;--accent:#0e8f88; color-scheme:light; } }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;
    padding:14px max(16px,env(safe-area-inset-left)) 14px max(16px,env(safe-area-inset-right));
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0);z-index:2}
  h1{font:600 16px/1.2 var(--sans);margin:0} h1 span{color:var(--accent)}
  header input{flex:1;min-width:140px;max-width:380px;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:8px;padding:7px 11px;font:13px/1 var(--mono)}
  header .count{color:var(--muted);font:12px/1 var(--mono)}
  a{color:var(--accent);font-size:12px;text-decoration:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;
    padding:16px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right))}
  .cell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
  .cell .imgwrap{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(45deg,#2a2a2a 25%,transparent 25%,transparent 75%,#2a2a2a 75%),
      linear-gradient(45deg,#2a2a2a 25%,#1e1e1e 25%,#1e1e1e 75%,#2a2a2a 75%);
    background-size:16px 16px;background-position:0 0,8px 8px}
  .cell img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  .cell .cap{padding:6px 8px;font:11px/1.3 var(--mono);color:var(--muted);border-top:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .cap b{color:var(--fg);font-weight:600}
  .empty{color:var(--muted);padding:40px 16px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>AXIS <span>Texture Gallery</span></h1>
  <input id="filter" type="text" placeholder="filter… (e.g. ARENA, METAL, ALPHA)" autocomplete="off">
  <span class="count" id="count"></span>
  <a href="index.html">← explorer</a>
</header>
<div class="grid" id="grid"><div class="empty">loading…</div></div>
<script>
let ALL=[];
const grid=document.getElementById("grid"), fin=document.getElementById("filter"), cnt=document.getElementById("count");
function render(q){
  q=q.trim().toLowerCase();
  const items=q?ALL.filter(t=>t.name.toLowerCase().includes(q)):ALL;
  cnt.textContent=items.length+" / "+ALL.length;
  if(!items.length){grid.innerHTML="<div class='empty'>No textures match.</div>";return;}
  grid.innerHTML="";
  const frag=document.createDocumentFragment();
  for(const t of items.slice(0,600)){
    const c=document.createElement("div"); c.className="cell";
    c.innerHTML=`<div class="imgwrap"><img loading="lazy" src="textures/${t.id}.png" alt="${t.name}"></div>`+
      `<div class="cap"><b>${t.name}</b><br>${t.w}×${t.h} · ${t.src}</div>`;
    frag.appendChild(c);
  }
  grid.appendChild(frag);
  if(items.length>600){ const m=document.createElement("div"); m.className="empty";
    m.textContent=`showing first 600 of ${items.length} — filter to narrow`; grid.appendChild(m); }
}
fin.addEventListener("input",e=>render(e.target.value));
fetch("textures/index.json").then(r=>r.json()).then(d=>{ ALL=d; render(""); })
  .catch(()=>{ grid.innerHTML="<div class='empty'>Run <code>python run.py</code> to decode textures.</div>"; });
</script>
</body>
</html>
