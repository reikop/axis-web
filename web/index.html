<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS Archive Explorer</title>
<style>
  /* layout: left rail of archive cards, main pane = filterable entry browser. dev-tool, dark-first. */
  :root{
    --bg:#0e1420; --panel:#151d2c; --panel2:#1b2638; --line:#263349;
    --fg:#e6edf6; --muted:#8aa0bd; --accent:#38d0c8; --accent2:#f2b24c; --danger:#f2708c;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#eef2f7; --panel:#fff; --panel2:#f4f7fb; --line:#d6deea;
      --fg:#172031; --muted:#5b6b85; --accent:#0e8f88; --accent2:#b9790e; --danger:#c43a5a;
      color-scheme:light; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);}
  a{color:var(--accent)}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;
    padding:14px max(16px,env(safe-area-inset-left)) 14px max(16px,env(safe-area-inset-right));
    border-bottom:1px solid var(--line);background:var(--panel);}
  header h1{font:600 16px/1.2 var(--sans);margin:0;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  header .stat{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;font:12px/1 var(--mono);color:var(--muted)}
  header .stat b{color:var(--fg);font-weight:600}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:0;min-height:0;height:calc(100% - 52px)}
  @media (max-width:760px){ .wrap{grid-template-columns:1fr;height:auto} }
  .rail{border-right:1px solid var(--line);overflow:auto;padding:12px;background:var(--panel)}
  .rail h2,.main h2{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:4px 2px 10px}
  .card{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:inherit;
    border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:pointer;font:inherit;display:block}
  .card:hover{border-color:var(--accent)}
  .card[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .card .nm{font:600 13px/1.2 var(--mono)}
  .card .mt{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font:11px/1.4 var(--mono);margin-top:4px}
  .card.blob .nm{color:var(--muted)}
  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px max(16px,env(safe-area-inset-right)) 12px 16px;border-bottom:1px solid var(--line)}
  .toolbar input{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:8px 11px;font:13px/1 var(--mono)}
  .toolbar input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .toolbar .count{color:var(--muted);font:12px/1 var(--mono)}
  .list{overflow:auto;min-height:0;padding:4px max(16px,env(safe-area-inset-right)) 24px 16px}
  .grp{margin-top:10px}
  .grp>summary{cursor:pointer;list-style:none;padding:6px 8px;border-radius:7px;
    font:600 12px/1.3 var(--mono);color:var(--accent);background:var(--panel2);display:flex;gap:8px;align-items:center}
  .grp>summary::-webkit-details-marker{display:none}
  .grp>summary .n{color:var(--muted);font-weight:400}
  .row{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 20px;border-bottom:1px solid var(--line);min-width:0}
  .row .nm{font:13px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .row .sz{font:12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge{font:600 10px/1 var(--mono);padding:3px 6px;border-radius:5px;white-space:nowrap;
    background:color-mix(in srgb,var(--accent2) 22%,transparent);color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent2) 40%,transparent)}
  .empty{color:var(--muted);padding:40px 16px;text-align:center;max-width:52ch;margin:0 auto}
  .empty code{background:var(--panel2);padding:2px 6px;border-radius:5px;font:12px/1.6 var(--mono)}
  .pill{font:11px/1 var(--mono);padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>AXIS <span style="color:var(--accent)">Archive Explorer</span></h1>
  <span class="sub" id="gamedir">loading catalog…</span>
  <div class="stat" id="topstats"></div>
</header>
<div class="wrap">
  <nav class="rail">
    <h2>Archives</h2>
    <div id="cards"></div>
    <h2 style="margin-top:16px">Media</h2>
    <div id="mediacards"></div>
  </nav>
  <section class="main">
    <div class="toolbar">
      <input id="filter" type="text" placeholder="filter by name… (e.g. ALIEN, GIRL, BACK)" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list">
      <div class="empty">Select an archive on the left to browse its entries.</div>
    </div>
  </section>
</div>
<script>
const fmtBytes = n => n>=1048576 ? (n/1048576).toFixed(1)+" MB"
  : n>=1024 ? (n/1024).toFixed(1)+" KB" : n+" B";
const el = (t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
let CAT=null, current=null;

function topFolder(name){ const i=name.search(/[\\/]/); return i<0 ? "(root)" : name.slice(0,i); }

function renderCards(){
  const cards=document.getElementById("cards"); cards.innerHTML="";
  const arch=CAT.archives||{};
  Object.keys(arch).sort().forEach(fn=>{
    const a=arch[fn];
    const b=el("button","card"+(a.indexed?"":" blob")); b.dataset.fn=fn;
    b.setAttribute("role","option");
    b.appendChild(el("div","nm",fn));
    const mt=el("div","mt");
    if(a.indexed){
      mt.appendChild(el("span",null,a.count+" "+(a.encrypted?"names":"entries")));
      if(a.encrypted) mt.appendChild(el("span",null,"🔓 decrypted"));
      const tex=(a.entries||[]).filter(e=>e.ptx).length;
      if(tex) mt.appendChild(el("span",null,tex+" textures"));
    } else {
      mt.appendChild(el("span",null,"binary · loader TBD"));
    }
    mt.appendChild(el("span",null,fmtBytes(a.file_size)));
    b.appendChild(mt);
    if(a.indexed) b.onclick=()=>select(fn);
    else b.onclick=()=>showBlob(fn,a);
    cards.appendChild(b);
  });
  const mc=document.getElementById("mediacards"); mc.innerHTML="";
  const media=CAT.media||{};
  [["maps","Maps (.bfd)"],["music","Music (.mp3)"],["sound","Sound (.wav)"]].forEach(([k,label])=>{
    const arr=media[k]||[]; if(!arr.length) return;
    const b=el("button","card"); b.appendChild(el("div","nm",label));
    const mt=el("div","mt"); mt.appendChild(el("span",null,arr.length+" files"));
    const tot=arr.reduce((s,x)=>s+x.size,0); mt.appendChild(el("span",null,fmtBytes(tot)));
    b.appendChild(mt); b.onclick=()=>showMedia(label,arr); mc.appendChild(b);
  });
}

function markSel(fn){ document.querySelectorAll(".card").forEach(c=>
  c.setAttribute("aria-selected", c.dataset.fn===fn ? "true":"false")); }

function select(fn){
  current={type:"arch",fn}; markSel(fn);
  document.getElementById("filter").value="";
  renderEntries(CAT.archives[fn].entries, "");
}
function renderEntries(entries, q){
  const list=document.getElementById("list"); list.innerHTML="";
  q=q.trim().toLowerCase();
  const groups={};
  let shown=0;
  for(const e of entries){
    if(q && !e.name.toLowerCase().includes(q)) continue;
    const g=topFolder(e.name); (groups[g]=groups[g]||[]).push(e); shown++;
  }
  document.getElementById("count").textContent = shown+" / "+entries.length+" entries";
  const keys=Object.keys(groups).sort();
  if(!keys.length){ list.appendChild(el("div","empty","No entries match “"+q+"”.")); return; }
  const openAll = !!q || keys.length<=3;
  for(const g of keys){
    const d=el("details","grp"); if(openAll) d.open=true;
    const s=el("summary"); s.appendChild(el("span",null,g));
    s.appendChild(el("span","n","· "+groups[g].length)); d.appendChild(s);
    for(const e of groups[g]){
      const r=el("div","row");
      r.appendChild(el("div","nm",e.name));
      if(e.ptx) r.appendChild(el("span","badge",e.ptx.w+"×"+e.ptx.h+" "+e.ptx.fmt));
      r.appendChild(el("div","sz",fmtBytes(e.size)));
      d.appendChild(r);
    }
    list.appendChild(d);
  }
}
function showBlob(fn,a){
  current=null; markSel(fn); document.getElementById("count").textContent="";
  const list=document.getElementById("list"); list.innerHTML="";
  const box=el("div","empty");
  box.innerHTML="<b style='color:var(--fg)'>"+fn+"</b><br>"+fmtBytes(a.file_size)+
    " · binary blob whose loader isn't reversed yet.<br><br>"+
    "These are decoded by the map / item / component loaders (see <code>docs/SPEC.md §2.3</code>). "+
    "Next RE target: <code>FUN_00467bf0</code> (the <code>.bfd</code> map loader).";
  list.appendChild(box);
}
function showMedia(label,arr){
  current=null; document.querySelectorAll(".card").forEach(c=>c.setAttribute("aria-selected","false"));
  document.getElementById("filter").value="";
  const list=document.getElementById("list"); list.innerHTML="";
  document.getElementById("count").textContent=arr.length+" files";
  const d=el("details","grp"); d.open=true;
  const s=el("summary"); s.appendChild(el("span",null,label));
  s.appendChild(el("span","n","· "+arr.length)); d.appendChild(s);
  for(const m of arr){
    const r=el("div","row"); r.appendChild(el("div","nm",m.name));
    if(m.version) r.appendChild(el("span","badge","ver "+m.version));
    r.appendChild(el("div","sz",fmtBytes(m.size))); d.appendChild(r);
  }
  list.appendChild(d);
}

document.getElementById("filter").addEventListener("input", e=>{
  if(current&&current.type==="arch") renderEntries(CAT.archives[current.fn].entries, e.target.value);
});

fetch("catalog.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
.then(cat=>{
  CAT=cat;
  document.getElementById("gamedir").textContent=cat.game_dir||"";
  const arch=cat.archives||{};
  const nArch=Object.keys(arch).length;
  const nEntries=Object.values(arch).reduce((s,a)=>s+(a.count||0),0);
  const nTex=Object.values(arch).reduce((s,a)=>s+(a.entries||[]).filter(e=>e.ptx).length,0);
  const nMaps=(cat.media&&cat.media.maps||[]).length;
  document.getElementById("topstats").innerHTML=
    "<span><b>"+nArch+"</b> archives</span><span><b>"+nEntries.toLocaleString()+"</b> entries</span>"+
    "<span><b>"+nTex.toLocaleString()+"</b> textures</span><span><b>"+nMaps+"</b> maps</span>";
  renderCards();
  // open the richest indexed archive first so the first view shows real content
  const first=Object.keys(arch).filter(k=>arch[k].indexed)
    .sort((a,b)=>(arch[b].count||0)-(arch[a].count||0))[0];
  if(first) select(first);
})
.catch(err=>{
  document.getElementById("gamedir").textContent="";
  document.getElementById("list").innerHTML=
    "<div class='empty'>Could not load <code>catalog.json</code> ("+err.message+").<br><br>"+
    "Run <code>python run.py</code> from the repo root — it builds the catalog from your "+
    "AXIS install and serves this page.</div>";
});
</script>
</body>
</html>
