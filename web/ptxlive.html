<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIS Live Texture Decode</title>
<style>
  :root{ --bg:#0e1420;--panel:#151d2c;--panel2:#1b2638;--line:#263349;--fg:#e6edf6;--muted:#8aa0bd;--accent:#38d0c8;
    --mono:ui-monospace,Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;color-scheme:dark;}
  @media (prefers-color-scheme:light){:root{--bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;--line:#d6deea;--fg:#172031;--muted:#5b6b85;--accent:#0e8f88;color-scheme:light;}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);
    padding:0 max(16px,env(safe-area-inset-left)) 40px}
  .wrap{max-width:1000px;margin:0 auto}
  header{padding:22px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
  h1{font:600 18px/1.2 var(--sans);margin:0} h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  #status{font:12px/1.5 var(--mono);color:var(--muted);margin:10px 0}
  #status b{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .cell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .cell .iw{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(45deg,#2a2a2a 25%,transparent 25%,transparent 75%,#2a2a2a 75%),
      linear-gradient(45deg,#2a2a2a 25%,#1e1e1e 25%,#1e1e1e 75%,#2a2a2a 75%);background-size:16px 16px;background-position:0 0,8px 8px}
  .cell canvas{width:100%;height:100%;image-rendering:pixelated}
  .cell .cap{padding:5px 7px;font:10px/1.3 var(--mono);color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AXIS <span>Live Texture Decode</span></h1>
    <div class="sub">PTX textures decoded <b style="color:var(--accent)">in the browser</b> by
      <code>ptx.js</code> — the reverse-engineered JPEG codec — straight from your own game files.</div>
  </header>
  <div id="status">loading…</div>
  <div class="grid" id="grid"></div>
  <p style="color:var(--muted);font-size:12px"><a href="home.html">← home</a> · reads <code>/game/AXIS.EXE</code>
    and <code>/game/Data/Image0.dat</code> served locally by <code>run.py</code>; nothing is uploaded.</p>
</div>
<script src="ptx.js"></script>
<script>
const st=document.getElementById("status"), grid=document.getElementById("grid");
const dec=new TextDecoder("euc-kr");
function name64(buf,o){const b=new Uint8Array(buf,o,0x40);let n=0;while(n<0x40&&b[n])n++;return dec.decode(b.subarray(0,n));}
(async()=>{
  try{
    st.innerHTML="fetching AXIS.EXE…";
    const exe=await (await fetch("/game/AXIS.EXE")).arrayBuffer();
    st.innerHTML="fetching Data/Image0.dat…";
    const dat=await (await fetch("/game/Data/Image0.dat")).arrayBuffer();
    const dv=new DataView(dat), count=dv.getUint32(0,true);
    // TOC: count * 68-byte records { name[64], u32 offset }
    const ents=[];
    for(let i=0;i<count;i++){const b=4+i*0x44; ents.push([name64(dat,b), dv.getUint32(b+0x40,true)]);}
    const N=Math.min(count,30);
    st.innerHTML=`<b>${count}</b> textures in Image0.dat · decoding first ${N} live in-browser…`;
    let okc=0, t0=performance.now();
    for(let i=0;i<N;i++){
      const off=ents[i][1], end=(i+1<count?ents[i+1][1]:dat.byteLength);
      const blob=dat.slice(off,end);
      let r; try{ r=decodePTX(blob,exe); }catch(e){ continue; }
      const cv=document.createElement("canvas"); cv.width=r.w; cv.height=r.h;
      const ctx=cv.getContext("2d"); const img=ctx.createImageData(r.w,r.h);
      img.data.set(r.rgba); ctx.putImageData(img,0,0);
      const cell=document.createElement("div"); cell.className="cell";
      const iw=document.createElement("div"); iw.className="iw"; iw.appendChild(cv);
      const cap=document.createElement("div"); cap.className="cap"; cap.textContent=ents[i][0]||("#"+i);
      cell.appendChild(iw); cell.appendChild(cap); grid.appendChild(cell); okc++;
    }
    const ms=Math.round(performance.now()-t0);
    st.innerHTML=`decoded <b>${okc}</b> textures in-browser in <b>${ms} ms</b> · codec: <code>ptx.js</code> (baseline JPEG, RE'd from AXIS.EXE)`;
  }catch(e){
    st.innerHTML=`Could not load game files (${e.message}). Run <code>python run.py</code> so <code>/game/</code> is served.`;
  }
})();
</script>
</body>
</html>
